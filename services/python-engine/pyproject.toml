[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textflow-python-engine"
version = "0.1.1"
description = "Local text preprocessing and analysis engine for TextFlow Studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.112.0",
  "jieba>=0.42.1",
  "networkx>=3.4",
  "matplotlib>=3.9.0",
  "numpy>=2.1.0",
  "openpyxl>=3.1.5",
  "xlrd>=2.0.1",
  "pandas>=2.2.3",
  "scikit-learn>=1.5.2",
  "wordcloud>=1.9.4",
  "uvicorn>=0.30.0",
  "yake>=0.4.8"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.3"
]
build = [
  "pyinstaller>=6.13.0"
]

[tool.setuptools]
packages = ["app"]
